<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#F8A4B8;--primary-dark:#E8839A;--primary-light:#FFDDE6;
  --secondary:#A8D8EA;--text-dark:#4A3F5C;--text-soft:#7A6F8C;
  --text-light:#B5AAC4;--bg-pastel:#FFF5F7;
  --shadow:0 8px 32px rgba(248,164,184,.15);
  --shadow-hover:0 12px 48px rgba(248,164,184,.25);
  --radius:16px;--transition:all .4s cubic-bezier(.34,1.56,.64,1)
}

/* ===== BACKGROUND GRID + BLACK OVERLAY ===== */
body{
  font-family:Nunito,Segoe UI,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:20px;margin:0;
  position:relative;
  background-color:#0a0a12;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 0%,#2A1A20 0%,#120A0E 55%,#050308 100%);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px,100% 100%;
  background-position:center center;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:rgba(0,0,0,.6);
}
body::after{
  content:'';position:fixed;z-index:0;pointer-events:none;
  width:min(560px,90vw);height:min(560px,90vw);
  top:50%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(248,164,184,.13) 0%,rgba(232,106,130,.06) 35%,transparent 70%);
  animation:glow-breathe 6s ease-in-out infinite;
}
@keyframes glow-breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}

/* ===== TRIGGER / LANDING FORM ===== */
.trigger-wrapper{
  position:relative;z-index:2;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:24px;padding:40px 32px 44px;
  box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 0 1px rgba(248,164,184,.15);
  text-align:center;max-width:440px;width:100%;
  animation:fadeIn .7s ease;
}
.trigger-wrapper.is-hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ===== LOGO AMPLOP TANPA PEMBUNGKUS (BESAR & MENCOLOK) ===== */
.trigger-wrapper .hero-logo{
  display:block;
  width:clamp(180px,58vw,250px);
  height:auto;
  margin:0 auto 6px;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-select:none;user-select:none;
  -webkit-user-drag:none;
  animation:float 3.2s ease-in-out infinite;
  filter:
    drop-shadow(0 14px 26px rgba(0,0,0,.28))
    drop-shadow(0 0 26px rgba(248,164,184,.65))
    drop-shadow(0 0 60px rgba(232,106,130,.45));
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}

.trigger-wrapper h1{
  font-size:23px;font-weight:800;color:var(--text-dark);
  margin-bottom:10px;letter-spacing:-.01em;line-height:1.35;
}
.trigger-wrapper p{
  font-size:14px;color:var(--text-soft);margin-bottom:28px;line-height:1.65;
}

.btn-open{
  display:inline-flex;align-items:center;justify-content:center;gap:11px;
  background:linear-gradient(135deg,#F8A4B8,#E8839A);
  color:#fff;border:none;padding:16px 46px;border-radius:999px;
  font-family:Nunito,sans-serif;font-size:17px;font-weight:700;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 10px 28px rgba(248,164,184,.5);
  letter-spacing:.02em;
}
.btn-open i{font-size:15px;transition:transform .3s ease}
.btn-open:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 16px 42px rgba(248,164,184,.65);
}
.btn-open:hover i{transform:translateX(5px)}
.btn-open:active{transform:scale(.97)}

/* ===== CONTENT STAGE (inline + fullscreen) ===== */
.content-stage{
  position:relative;
  z-index:2;
  width:100%;
  max-width:900px;
  height:min(82vh,760px);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 0 1px rgba(248,164,184,.15);
  display:none;
  flex-direction:column;
  background:#0d0709;
  animation:fadeIn .5s ease;
}
.content-stage.active{display:flex}
.content-stage.fullscreen{
  position:fixed;
  inset:0;
  z-index:9998;
  max-width:none;
  width:100%;
  height:100%;
  border-radius:0;
  box-shadow:none;
  animation:fadeInFs .5s ease;
}
@keyframes fadeInFs{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

.content-stage iframe{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  border:none;
  background:#fff;
  display:block;
}

/* ===== CONTENT HEADER (muncul di mode inline) ===== */
.content-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,#1a0f14 0%,#22121a 100%);
  border-bottom:1px solid rgba(248,164,184,.18);
  flex:0 0 auto;
}
.content-stage.fullscreen .content-header{display:none}

.content-title{
  display:inline-flex;align-items:center;gap:8px;
  font-family:Nunito,sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.03em;color:#FFD1DC;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.content-title i{color:#FF8A9E;font-size:13px}

.btn-fs-inline{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#F8A4B8,#E8839A);
  color:#fff;border:none;
  padding:9px 16px;border-radius:999px;
  font-family:Nunito,sans-serif;font-size:13px;font-weight:800;
  cursor:pointer;transition:var(--transition);
  box-shadow:0 6px 18px rgba(248,164,184,.4);
  letter-spacing:.03em;white-space:nowrap;
}
.btn-fs-inline i{font-size:13px;transition:transform .3s ease}
.btn-fs-inline:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 10px 26px rgba(248,164,184,.65);
}
.btn-fs-inline:hover i{transform:scale(1.15)}
.btn-fs-inline:active{transform:scale(.96)}

/* ===== CLOSE BUTTON (mode fullscreen) ===== */
.btn-close-fullscreen{
  position:fixed;top:20px;right:20px;z-index:9999;
  background:rgba(255,255,255,.12);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);
  color:#fff;width:48px;height:48px;border-radius:50%;font-size:18px;
  cursor:pointer;transition:var(--transition);display:none;
  align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.3);font-family:Nunito,sans-serif
}
.btn-close-fullscreen i{pointer-events:none}
.btn-close-fullscreen:hover{
  background:rgba(239,68,68,.35);transform:scale(1.06) rotate(90deg);
  border-color:rgba(239,68,68,.4)
}
.btn-close-fullscreen:active{transform:scale(.9)}
.btn-close-fullscreen.active{display:flex}

/* ===== LOADING OVERLAY ===== */
.loading-overlay{
  position:fixed;inset:0;
  background:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 30%,#2A1A20 0%,#1A0E12 50%,#0D0709 100%);
  background-size:60px 60px,60px 60px,100% 100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;opacity:0;pointer-events:none;transition:opacity .5s ease
}
.loading-overlay::before{
  content:'';position:absolute;inset:0;background:rgba(0,0,0,.4);pointer-events:none;
}
.loading-overlay.active{opacity:1;pointer-events:all}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-overlay .stars-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.loading-overlay .stars-bg span{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
  animation:twinkle 3s ease-in-out infinite alternate
}
.loading-overlay .stars-bg span:nth-child(1){width:2px;height:2px;top:10%;left:15%;animation-delay:.5s}
.loading-overlay .stars-bg span:nth-child(2){width:3px;height:3px;top:20%;right:20%;animation-delay:1s}
.loading-overlay .stars-bg span:nth-child(3){width:1.5px;height:1.5px;top:40%;left:8%;animation-delay:1.5s}
.loading-overlay .stars-bg span:nth-child(4){width:2.5px;height:2.5px;top:55%;right:12%;animation-delay:.8s}
.loading-overlay .stars-bg span:nth-child(5){width:2px;height:2px;bottom:30%;left:22%;animation-delay:2s}
.loading-overlay .stars-bg span:nth-child(6){width:3px;height:3px;bottom:15%;right:25%;animation-delay:1.2s}
.loading-overlay .stars-bg span:nth-child(7){width:1.5px;height:1.5px;top:70%;left:40%;animation-delay:.3s}
.loading-overlay .stars-bg span:nth-child(8){width:2px;height:2px;top:8%;left:55%;animation-delay:1.8s}
.loading-overlay .stars-bg span:nth-child(9){width:2.5px;height:2.5px;top:45%;right:30%;animation-delay:.6s}
.loading-overlay .stars-bg span:nth-child(10){width:1.5px;height:1.5px;bottom:40%;left:60%;animation-delay:2.2s}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:.85;transform:scale(1.2)}}

.loading-overlay .flower-wrapper{
  position:relative;width:140px;height:140px;display:flex;
  align-items:center;justify-content:center;z-index:1
}
.loading-overlay .flower-wrapper::before{
  content:'';position:absolute;inset:-25px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,77,109,.4) 0%,rgba(255,77,109,.15) 30%,rgba(232,106,130,.08) 50%,transparent 75%);
  animation:glow-pulse 2.5s ease-in-out infinite;pointer-events:none
}
.loading-overlay .flower-wrapper::after{
  content:'';position:absolute;inset:-45px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,182,193,.12) 0%,transparent 70%);
  animation:glow-pulse 3.5s ease-in-out infinite reverse;pointer-events:none
}
@keyframes glow-pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.loading-overlay .flower-wrapper img{
  width:100%;height:100%;object-fit:contain;
  animation:bounce-envelope 2s ease-in-out infinite;
  will-change:transform;
  filter:drop-shadow(0 4px 20px rgba(232,106,130,.35)) drop-shadow(0 0 40px rgba(255,77,109,.15));
  position:relative;z-index:1
}
@keyframes bounce-envelope{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-12px) rotate(3deg)}
}

.loading-overlay .progress-wrapper{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  width:100%;max-width:240px;z-index:1;margin-top:8px;position:relative
}
.loading-overlay .progress-wrapper .loading-text{
  font-size:14px;color:#FFD1DC;font-family:Nunito,Segoe UI,Arial,sans-serif;
  font-weight:500;letter-spacing:.02em;text-align:center;
  animation:text-pulse 2s ease-in-out infinite;text-shadow:0 2px 20px rgba(0,0,0,.5);
  display:inline-flex;align-items:center;gap:8px;
}
.loading-overlay .progress-wrapper .loading-text i{
  font-size:13px;color:#FF8A9E;
}
@keyframes text-pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.loading-overlay .progress-wrapper .progress-bar{
  width:100%;height:5px;border-radius:9999px;background:rgba(255,182,193,.1);
  overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)
}
.loading-overlay .progress-wrapper .progress-bar .progress-fill{
  height:100%;border-radius:9999px;
  background:linear-gradient(90deg,#FF8A9E,#FF4D6D,#E86A82,#FF4D6D,#FF8A9E);
  background-size:300% 100%;width:0%;transition:width .15s ease;
  animation:shimmer 2s ease-in-out infinite;box-shadow:0 0 20px rgba(255,77,109,.3)
}
@keyframes shimmer{0%{background-position:-300% 0}100%{background-position:300% 0}}
.loading-overlay .progress-wrapper .percentage{
  font-size:16px;font-weight:700;font-family:Nunito,Segoe UI,Arial,sans-serif;
  color:#FF4D6D;letter-spacing:.05em;min-width:44px;text-align:center;
  background:rgba(255,255,255,.05);padding:3px 14px;border-radius:20px;
  border:1px solid rgba(255,182,193,.08);text-shadow:0 0 20px rgba(255,77,109,.15)
}

@media(max-width:480px){
  body{padding:12px}
  .btn-close-fullscreen{top:12px;right:12px;width:40px;height:40px;font-size:15px}
  .loading-overlay .flower-wrapper{width:105px;height:105px}
  .loading-overlay .flower-wrapper::before{inset:-18px}
  .loading-overlay .flower-wrapper::after{inset:-30px}
  .loading-overlay .progress-wrapper{max-width:180px}
  .loading-overlay .progress-wrapper .loading-text{font-size:12px}
  .loading-overlay .progress-wrapper .percentage{font-size:14px}
  .trigger-wrapper{padding:32px 22px 36px}
  .trigger-wrapper h1{font-size:19px}
  .trigger-wrapper .hero-logo{width:clamp(160px,62vw,215px)}
  .btn-open{padding:14px 36px;font-size:15px}
  .content-stage{height:min(78vh,720px);border-radius:14px}
  .content-header{padding:8px 10px}
  .content-title{font-size:11.5px}
  .btn-fs-inline{padding:8px 12px;font-size:12px}
  .btn-fs-inline i{font-size:12px}
}
@media(max-width:360px){
  .loading-overlay .flower-wrapper{width:85px;height:85px}
  .loading-overlay .flower-wrapper::before{inset:-12px}
  .loading-overlay .flower-wrapper::after{inset:-20px}
  .loading-overlay .progress-wrapper{max-width:150px}
  .loading-overlay .progress-wrapper .loading-text{font-size:11px}
  .loading-overlay .progress-wrapper .percentage{font-size:12px;padding:2px 10px}
  .trigger-wrapper .hero-logo{width:clamp(145px,66vw,190px)}
  .content-title span{display:none}
}
@media(prefers-reduced-motion:reduce){
  .loading-overlay .flower-wrapper img,
  .loading-overlay .flower-wrapper::before,
  .loading-overlay .flower-wrapper::after,
  .loading-overlay .progress-wrapper .loading-text,
  .loading-overlay .progress-wrapper .progress-bar .progress-fill,
  .loading-overlay .stars-bg span,
  .trigger-wrapper .hero-logo,
  body::after{animation:none!important}
}
</style>
</head>
<body>

<!-- ================= TRIGGER / LANDING FORM ================= -->
<div class="trigger-wrapper" id="triggerWrapper">
  <img class="hero-logo" src="kimmygift.com/images/ChatGPT_Image_Sep_10__2026__02_41_56_PM_1789026297958.png" alt="Envelope">
  <h1>Haii, Sayangg abanggg ada sesuatu buat dedeee!</h1>
  <p>Maaf yaa, kalo jelek, semoga dedeee suka!</p>
  <button class="btn-open" id="btnOpen">
    <span>Lihat</span>
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>

<!-- ================= CONTENT STAGE (inline + fullscreen) ================= -->
<div class="content-stage" id="contentStage">
  <div class="content-header" id="contentHeader">
    <div class="content-title">
      <i class="fa-solid fa-gift"></i>
      <span>Kejutan Spesial</span>
    </div>
    <button class="btn-fs-inline" id="btnFullscreenInline" title="Full Screen">
      <i class="fa-solid fa-expand"></i>
      <span>Full Screen</span>
    </button>
  </div>
  <iframe id="contentIframe" sandbox="allow-scripts allow-same-origin allow-modals allow-popups"></iframe>
</div>

<!-- ================= CLOSE BUTTON ================= -->
<button class="btn-close-fullscreen" id="btnCloseFullscreen" title="Tutup">
  <i class="fa-solid fa-xmark"></i>
</button>

<!-- ================= LOADING OVERLAY ================= -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="stars-bg"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="flower-wrapper">
    <img src="kimmygift.com/images/ChatGPT_Image_Sep_10__2026__02_41_56_PM_1789026297958.png" alt="Loading" loading="eager" decoding="async">
  </div>
  <div class="progress-wrapper">
    <p class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Sebentar, sedang memuat...</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="percentage" id="percentage">0%</span>
  </div>
</div>

<script>
(function(){'use strict';

// ESC key: keluar dari mode fullscreen
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(contentStage&&contentStage.classList.contains('fullscreen')){
      exitToMainContent();
    }
  }
});


// ELEMENTS
var contentStage=document.getElementById('contentStage');
var iframe=document.getElementById('contentIframe');
var btnClose=document.getElementById('btnCloseFullscreen');
var btnOpen=document.getElementById('btnOpen');
var btnFullscreenInline=document.getElementById('btnFullscreenInline');
var loadingOverlay=document.getElementById('loadingOverlay');
var triggerWrapper=document.getElementById('triggerWrapper');
var progressFill=document.getElementById('progressFill');
var percentageEl=document.getElementById('percentage');

// STATE
var progress=0,isComplete=false,progressInterval=null;
var openTimers=[];
var iframeLoaded=false;

function clearOpenTimers(){
  for(var i=0;i<openTimers.length;i++){clearTimeout(openTimers[i])}
  openTimers=[];
}

// PROGRESS
function startProgress(){
  if(progressInterval)return;
  progressInterval=setInterval(function(){
    if(isComplete){clearInterval(progressInterval);progressInterval=null;return}
    progress+=1.18;
    if(progress>=100){progress=100;isComplete=true;clearInterval(progressInterval);progressInterval=null}
    var r=Math.round(progress);
    if(progressFill)progressFill.style.width=r+'%';
    if(percentageEl)percentageEl.textContent=r+'%';
  },30);
}

function completeLoading(){
  if(isComplete)return;
  progress=100;isComplete=true;
  if(progressInterval){clearInterval(progressInterval);progressInterval=null}
  if(progressFill)progressFill.style.width='100%';
  if(percentageEl)percentageEl.textContent='100%';
}

function resetProgress(){
  progress=0;isComplete=false;
  if(progressInterval){clearInterval(progressInterval);progressInterval=null}
  if(progressFill)progressFill.style.width='0%';
  if(percentageEl)percentageEl.textContent='0%';
}

// MUAT KONTEN KE IFRAME (dari content.html)
function writeIframeContent(){
  iframe.src='content.html';
  iframeLoaded=true;
}

// KOSONGKAN IFRAME
function clearIframe(){
  iframeLoaded=false;
  try{iframe.src='about:blank'}catch(err){}
}

// EXIT NATIVE FULLSCREEN
function exitNativeFullscreen(){
  try{
    var el=document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
    if(!el)return;
    var p=null;
    if(document.exitFullscreen)p=document.exitFullscreen();
    else if(document.webkitExitFullscreen)p=document.webkitExitFullscreen();
    else if(document.msExitFullscreen)p=document.msExitFullscreen();
    if(p&&typeof p.catch==='function')p.catch(function(){});
  }catch(e){}
}

// REQUEST NATIVE FULLSCREEN
function requestNativeFullscreen(){
  try{
    var el=document.documentElement;
    var p=null;
    if(el.requestFullscreen)p=el.requestFullscreen();
    else if(el.webkitRequestFullscreen)p=el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen)p=el.msRequestFullscreen();
    if(p&&typeof p.catch==='function')p.catch(function(){});
  }catch(e){}
}

// BUKA FULLSCREEN (dari landing amplop)
function openFullscreen(){
  if(contentStage.classList.contains('active'))return;
  clearOpenTimers();

  if(triggerWrapper)triggerWrapper.classList.add('is-hidden');
  contentStage.classList.remove('active','fullscreen');

  loadingOverlay.classList.add('active');
  loadingOverlay.classList.remove('hidden');

  resetProgress();
  startProgress();

  openTimers.push(setTimeout(function(){
    completeLoading();
    loadingOverlay.classList.remove('active');
    loadingOverlay.classList.add('hidden');

    openTimers.push(setTimeout(function(){
      contentStage.classList.add('active','fullscreen');
      btnClose.classList.add('active');
      if(!iframeLoaded)writeIframeContent();
      requestNativeFullscreen();
      window.dispatchEvent(new Event('resize'));
    },600));
  },2800));
}

// DARI INLINE -> KEMBALI KE FULLSCREEN (tombol di header)
function enterFullscreenFromInline(){
  if(!contentStage.classList.contains('active'))return;
  if(contentStage.classList.contains('fullscreen'))return;

  // pastikan konten sudah ada
  if(!iframeLoaded)writeIframeContent();

  contentStage.classList.add('fullscreen');
  btnClose.classList.add('active');
  requestNativeFullscreen();
  window.dispatchEvent(new Event('resize'));
}

// KELUAR DARI FULLSCREEN -> TAMPILKAN KONTEN SEBAGAI HALAMAN UTAMA (inline)
function exitToMainContent(){
  clearOpenTimers();

  var wasFullscreen=contentStage.classList.contains('fullscreen');

  contentStage.classList.remove('fullscreen');
  contentStage.classList.add('active');

  btnClose.classList.remove('active');

  loadingOverlay.classList.remove('active');
  loadingOverlay.classList.add('hidden');
  resetProgress();

  if(triggerWrapper)triggerWrapper.classList.add('is-hidden');

  if(wasFullscreen)exitNativeFullscreen();

  try{window.scrollTo(0,0)}catch(e){}
  window.dispatchEvent(new Event('resize'));
}

// Jika user keluar dari native fullscreen, kembali ke tampilan inline (bukan amplop)
['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(function(evt){
  document.addEventListener(evt,function(){
    var el=document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
    if(!el && contentStage.classList.contains('fullscreen')){
      exitToMainContent();
    }
  });
});

// EVENT
if(btnOpen){
  btnOpen.addEventListener('click',function(e){
    e.preventDefault();
    openFullscreen();
  });
}

if(btnClose){
  btnClose.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    exitToMainContent();
  });
}

if(btnFullscreenInline){
  btnFullscreenInline.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    enterFullscreenFromInline();
  });
}

// EXPOSE API
window.KimmyLoading={
  complete:completeLoading,
  setProgress:function(v){
    var val=Math.min(Math.max(v,0),100);
    progress=val;
    if(progressFill)progressFill.style.width=val+'%';
    if(percentageEl)percentageEl.textContent=Math.round(val)+'%';
    if(val>=100&&!isComplete){
      isComplete=true;
      if(progressInterval){clearInterval(progressInterval);progressInterval=null}
    }
  },
  getProgress:function(){return Math.round(progress)},
  isComplete:function(){return isComplete},
  open:openFullscreen,
  close:exitToMainContent,
  fullscreen:enterFullscreenFromInline
};

console.log('Surprise Gift - Trigger Button + EJS');
})();
</script>
